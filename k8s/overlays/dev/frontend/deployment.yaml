apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: dev

  labels:
    app: frontend

  annotations:
    kubernetes.io/change-cause: "Initial Frontend Deployment"

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend

          image: 027742774373.dkr.ecr.us-east-1.amazonaws.com/frontend:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 80

          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: frontend-config
                  key: NODE_ENV

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5